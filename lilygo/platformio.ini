; ============================================================
;  BISINDO Smart Glasses — firmware
;  Hardware : LILYGO T-Glass (ESP32-S3 FN4R2, 4 MB Flash / 2 MB QSPI PSRAM)
;  Platform : espressif32, Arduino framework
; ============================================================

[platformio]
default_envs = t-glass
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, esp32_exception_decoder

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; Repo LilyGo memakai branch default "master" (bukan "main"), jadi
    ; ref-nya harus ditulis eksplisit agar clone tidak menggantung.
    https://github.com/Xinyuan-LilyGO/LilyGo-T-Wristband-and-T-Glass.git#master
    lvgl/lvgl@8.4.0
    lewisxhe/SensorLib@0.1.8
    arduino-libraries/Madgwick@^1.2.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    ; FS / SPIFFS / SD bukan paket registry — keduanya sudah bagian
    ; framework Arduino ESP32, jadi tidak perlu didaftarkan di sini.

; ------------------------------------------------------------------
;  T-Glass (dan T-Wristband). Definisi board diambil langsung dari
;  repo resmi LilyGo supaya flash 4 MB + PSRAM QSPI + partisi default
;  benar sejak awal — jangan pakai esp32-s3-devkitc-1 apa adanya.
; ------------------------------------------------------------------
[env:t-glass]
board = LilyGO-T-Wristband-and-T-Glass
